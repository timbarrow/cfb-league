[theme]
base = "dark"
primaryColor = "#123b7a"
backgroundColor = "#17231d"
secondaryBackgroundColor = "#1f3327"
textColor = "#f7f3e8"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[server]
enableStaticServing = false
maxUploadSize = 5

[browser]
gatherUsageStats = false
