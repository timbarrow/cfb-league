[theme]
base = "dark"
primaryColor = "#27d17f"
backgroundColor = "#07110e"
secondaryBackgroundColor = "#11261e"
textColor = "#f4f2e8"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[server]
enableStaticServing = false
maxUploadSize = 5

[browser]
gatherUsageStats = false
