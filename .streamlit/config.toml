[theme]
base = "dark"
primaryColor = "#f97316"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[server]
enableStaticServing = false
maxUploadSize = 5

[browser]
gatherUsageStats = false
