name: CFB live scores

on:
  schedule:
    # Off-hour minute marks reduce GitHub scheduler congestion. All times CT.
    # Mon–Wed evening final-score checks.
    - cron: "11 20,22 * 8-12,1 1-3"
      timezone: "America/Chicago"
    - cron: "53 23 * 8-12,1 1-3"
      timezone: "America/Chicago"
    # Thursday and Friday games, about every seven minutes through midnight.
    - cron: "3,10,17,24,31,38,45,52,59 20-23 * 8-12,1 4,5"
      timezone: "America/Chicago"
    - cron: "3,10,17,24,31,38,45,52,59 0 * 8-12,1 5,6"
      timezone: "America/Chicago"
    # Saturday slate through 2 AM Sunday, plus a 6:11 AM final sweep.
    - cron: "3,10,17,24,31,38,45,52,59 11-23 * 8-12,1 6"
      timezone: "America/Chicago"
    - cron: "3,10,17,24,31,38,45,52,59 0-1 * 8-12,1 0"
      timezone: "America/Chicago"
    - cron: "11 2,6 * 8-12,1 0"
      timezone: "America/Chicago"
  workflow_dispatch:

concurrency:
  group: cfb-live-scores
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      LOG_LEVEL: INFO

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Refresh live scores
        run: python cfb_sync.py --live

      - name: Settle completed bets
        run: python settle_bets.py
