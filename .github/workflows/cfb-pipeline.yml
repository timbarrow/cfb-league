name: CFB pipeline (sync odds + settle bets)

on:
  schedule:
    # Daily at 8:07 AM: games, rankings and DraftKings lines.
    - cron: "7 8 * 8-12,1 *"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      sync_mode:
        description: "Data refresh to run"
        type: choice
        options:
          - live
          - daily
        default: live
      dry_run:
        description: "Grade bets without writing"
        type: boolean
        default: false

concurrency:
  group: cfb-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      LOG_LEVEL: INFO

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Refresh board or live results
        env:
          EVENT_NAME: ${{ github.event_name }}
          SYNC_MODE: ${{ inputs.sync_mode }}
        run: |
          if [ "$SYNC_MODE" = "daily" ] || [ "$EVENT_NAME" = "schedule" ]; then
            python cfb_sync.py
          else
            python cfb_sync.py --live
          fi

      - name: Settle completed bets
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python settle_bets.py --dry-run
          else
            python settle_bets.py
          fi
